<h2>Películas mejor valoradas</h2>

@if (loading) {
  <p style="text-align: center; padding: 2rem;">Cargando películas...</p>
}

@if (error) {
  <p style="color: red; text-align: center;">{{ error }}</p>
}

@if (!loading && !error) {
  <div class="movie-grid">
    @for (movie of movies; track movie.id) {
      <article class="movie-card">
        <img [src]="getImageUrl(movie.poster_path)" [alt]="movie.title" class="poster">
        <div class="card-content">
          <h3>{{ movie.title }}</h3>
          <p class="rating">⭐ {{ movie.vote_average | number:'1.1-1' }} / 10</p>
          <a [routerLink]="['/pelicula', movie.id]" class="btn-detail">Ver detalle</a>
        </div>
      </article>
    }
  </div>
}
